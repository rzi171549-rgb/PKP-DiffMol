dataset: ToxCast
method: PKP-DiffMol
group: G4
final_protocol: old_g4_68p40
seed: 2

result:
  test_auc: 0.6839618884401093
  test_auc_percent: 68.39618884401093
  rounded_percent: 68.40
  valid_auc: 0.7164397787300174
  best_epoch: 24

training:
  runner: scripts/train.py
  implementation: toxcast_old_g4_latentdiff

optimization:
  epochs: 80
  batch_size: 64
  lr: 0.0001
  warmup_ratio: 0.06
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine

dropout:
  pooler_dropout: 0.1
  desc_dropout: 0.0
  fusion_dropout: 0.0
  desc_text_fusion_dropout: 0.1

representation:
  fusion_mode: residual
  fusion_alpha_init: 0.005
  text_encoder_name_or_path: assets/text_encoder_name_or_path

diffusion:
  diffusion_epochs: 30
  diffusion_lr: 0.001
  synthetic_rho: 0.05
  qgate_quantile: 0.95
  stage_c_epochs: 15
  stage_c_batch_size: 256
  stage_c_lr: 0.0003
  stage_c_weight_decay: 0.0
  stage_c_grad_clip: 1.0

paths:
  checkpoint: assets/smi_editor.pt
  dictionary: assets/smi_dict_token.txt
  data_dir: data/toxcast
