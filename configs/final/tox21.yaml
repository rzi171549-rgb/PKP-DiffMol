dataset: Tox21
method: PKP-DiffMol
group: G4
final_protocol: chemprior_parallel_latentdiff
seed: 0

result:
  test_auc: 0.7851852709742264
  test_auc_percent: 78.51852709742263
  valid_auc: 0.783571865509218
  valid_auc_percent: 78.3571865509218
  best_epoch: 6

training:
  runner: scripts/train.py
  implementation: tox21_general_latentdiff

optimization:
  epochs: 80
  batch_size: 128
  lr: 0.0001
  warmup_ratio: 0.06
  weight_decay: 0.01
  grad_clip: 1.0
  scheduler: cosine

dropout:
  pooler_dropout: 0.1
  desc_dropout: 0.0
  fusion_dropout: 0.0
  desc_text_fusion_dropout: 0.1

representation:
  fusion_mode: residual
  fusion_alpha_init: 0.005
  text_encoder_name_or_path: assets/text_encoder_name_or_path

diffusion:
  diffusion_epochs: 15
  diffusion_lr: 0.001
  synthetic_rho: 0.05
  qgate_quantile: 0.95
  stage_c_epochs: 15
  stage_c_batch_size: 128
  stage_c_lr: 0.0003
  stage_c_weight_decay: 0.0
  stage_c_grad_clip: 1.0

paths:
  checkpoint: assets/smi_editor.pt
  dictionary: assets/smi_dict_token.txt
  data_dir: data/tox21
